name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '25 16 * * *'

defaults:
  run:
    shell: bash

jobs:
  dist-check:
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json

      - run: npm ci
      - run: npm run build

      - id: diff
        run: git diff --exit-code --color --ignore-space-at-eol --text dist/

      - if: ${{ always() && steps.diff.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  eslint:
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json

      - run: npm ci
      - run: npm run build
      - run: npm run lint

  prettier:
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json

      - run: npm ci
      - run: npm run format && git diff --color --exit-code

  actionlint:
    runs-on: ubuntu-slim

    permissions:
      contents: read

    env:
      # renovate: datasource=github-releases depName=rhysd/actionlint
      ACTIONLINT_VERSION: 1.7.12

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - working-directory: ${{ runner.temp }}
        run: |
          wget "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          mkdir actionlint
          tar -C actionlint -xf "actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$(pwd)/actionlint" >>"$GITHUB_PATH"
          wget "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/.github/actionlint-matcher.json"
          echo "::add-matcher::$(pwd)/actionlint-matcher.json"

      - run: actionlint -verbose -color

  test:
    needs: dist-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      PACKAGE_NAME: ${{ github.event.repository.name }}/test-${{ github.run_id }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ github.token }}

      - run: echo "$GITHUB_TOKEN" | skopeo login -u "$GITHUB_REPOSITORY_OWNER" --password-stdin ghcr.io
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - id: meta1
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=tag2

      - id: build1
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: test
          tags: ${{ steps.meta1.outputs.tags }}
          labels: ${{ steps.meta1.outputs.labels }}
          annotations: ${{ steps.meta1.outputs.annotations }}
          cache-to: type=inline
          push: true

      - id: build1_children
        run: |
          { echo 'digests<<EOF'; skopeo inspect --raw "$IMAGE" | jq -r 'try .manifests[].digest' | tac; echo 'EOF'; } | tee -a "$GITHUB_OUTPUT"
        env:
          IMAGE: docker://ghcr.io/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}@${{ steps.build1.outputs.digest }}

      - run: sleep 2

      - uses: ./.github/actions/test
        name: No durations set, do nothing
        with:
          name: ${{ env.PACKAGE_NAME }}
          expected-deletions: ''

      - uses: ./.github/actions/test
        name: Untagged duration set, but no untagged versions
        with:
          name: ${{ env.PACKAGE_NAME }}
          untagged-retention-duration: 0dT1s
          expected-deletions: ''

      - uses: ./.github/actions/test
        name: All tags match, matching retention duration expired
        with:
          name: ${{ env.PACKAGE_NAME }}
          tag-patterns: |
            !nomatch
          matching-tags-retention-duration: 0dT1s
          untagged-retention-duration: 0dT1s
          expected-deletions: |
            ${{ steps.build1.outputs.digest }}
            ${{ steps.build1_children.outputs.digests }}

      - uses: ./.github/actions/test
        name: No matching tags, mismatching retention duration expired
        with:
          name: ${{ env.PACKAGE_NAME }}
          tag-patterns: |
            *
            !latest
            !tag2
          mismatching-tags-retention-duration: 0dT1s
          untagged-retention-duration: 0dT1s
          expected-deletions: |
            ${{ steps.build1.outputs.digest }}
            ${{ steps.build1_children.outputs.digests }}

      - uses: ./.github/actions/test
        name: No matching tags, empty tag-patterns, mismatching retention duration expired
        with:
          name: ${{ env.PACKAGE_NAME }}
          tag-patterns: |
            # empty
          mismatching-tags-retention-duration: 0dT1s
          untagged-retention-duration: 0dT1s
          expected-deletions: |
            ${{ steps.build1.outputs.digest }}
            ${{ steps.build1_children.outputs.digests }}

      - uses: ./.github/actions/test
        name: latest tag matches, tag2 doesn't, both retention durations expired
        with:
          name: ${{ env.PACKAGE_NAME }}
          tag-patterns: latest
          matching-tags-retention-duration: 0dT1s
          mismatching-tags-retention-duration: 0dT1s
          untagged-retention-duration: 0dT1s
          expected-deletions: |
            ${{ steps.build1.outputs.digest }}
            ${{ steps.build1_children.outputs.digests }}

      - uses: ./.github/actions/test
        name: latest tag matches, tag2 doesn't, mismatching retention duration not expired
        with:
          name: ${{ env.PACKAGE_NAME }}
          tag-patterns: |
            *
            !tag2
          matching-tags-retention-duration: 0dT1s
          mismatching-tags-retention-duration: 1d
          untagged-retention-duration: 0dT1s
          expected-deletions: ''

      - uses: ./.github/actions/test
        name: latest tag matches, tag2 doesn't, matching retention duration not expired
        with:
          name: ${{ env.PACKAGE_NAME }}
          tag-patterns: latest
          matching-tags-retention-duration: 1w
          mismatching-tags-retention-duration: 0dT1s
          untagged-retention-duration: 0dT1s
          expected-deletions: ''

      - uses: ./.github/actions/test
        name: All tags match, matching retention duration expired, mismatching retention duration not expired
        with:
          name: ${{ env.PACKAGE_NAME }}
          tag-patterns: |
            !*
            latest
            tag2
          matching-tags-retention-duration: 0dT1s
          mismatching-tags-retention-duration: 1y
          untagged-retention-duration: 0dT1s
          expected-deletions: |
            ${{ steps.build1.outputs.digest }}
            ${{ steps.build1_children.outputs.digests }}

      - uses: ./.github/actions/test
        name: No matching tags, mismatching retention duration expired, matching retention duration not expired
        with:
          name: ${{ env.PACKAGE_NAME }}
          tag-patterns: |
            !*
          matching-tags-retention-duration: 1m
          mismatching-tags-retention-duration: 0dT1s
          untagged-retention-duration: 0dT1s
          expected-deletions: |
            ${{ steps.build1.outputs.digest }}
            ${{ steps.build1_children.outputs.digests }}

      - id: meta2
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=tag2

      - id: build2
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: test
          tags: ${{ steps.meta2.outputs.tags }}
          labels: ${{ steps.meta2.outputs.labels }}
          annotations: ${{ steps.meta2.outputs.annotations }}
          cache-from: ${{ steps.meta1.outputs.tags }}
          push: true

      - run: sleep 2

      - uses: ./.github/actions/test
        name: Untagged retention duration not expired
        with:
          name: ${{ env.PACKAGE_NAME }}
          untagged-retention-duration: 1d
          expected-deletions: ''

      - uses: ./.github/actions/test
        name: Untagged retention duration expired
        with:
          name: ${{ env.PACKAGE_NAME }}
          untagged-retention-duration: 0dT1s
          expected-deletions: |
            ${{ steps.build1.outputs.digest }}
            ${{ steps.build1_children.outputs.digests }}

      - uses: ./.github/actions/test
        name: Untagged retention duration expired, actual deletion
        with:
          name: ${{ env.PACKAGE_NAME }}
          untagged-retention-duration: 0dT1s
          dry-run: false
          expected-deletions: |
            ${{ steps.build1.outputs.digest }}
            ${{ steps.build1_children.outputs.digests }}

      - run: >-
          gh api --jq '.[].name' "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME////%2F}/versions" | grep "$DIGEST2"
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST2: ${{ steps.build2.outputs.digest }}

      - run: |
          for digest in $(skopeo inspect --raw "$IMAGE" | jq -r 'try .manifests[].digest')
          do
            gh api --jq '.[].name' "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME////%2F}/versions" | grep "$digest"
          done
        env:
          IMAGE: docker://ghcr.io/${{ github.repository_owner }}/${{ env.PACKAGE_NAME }}@${{ steps.build2.outputs.digest }}
          GH_TOKEN: ${{ github.token }}

      - if: always() && steps.build1.outcome == 'success'
        run: >-
          gh api --method DELETE "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${PACKAGE_NAME////%2F}"
        env:
          GH_TOKEN: ${{ github.token }}

      - if: always()
        run: skopeo logout ghcr.io
